name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: node tests/lint/no_content_logs_test.mjs && node tests/lint/no_content_logs.mjs
      - run: cd tests/sql && npm ci && node run.mjs
      - run: deno test --allow-env=APP_URL,MAILER_URL,MAILER_SECRET --allow-read=apps/web tests/moderation/moderation_test.ts tests/web/pw_test.ts tests/web/event_text_test.ts tests/moderation/email_test.ts tests/web/export_test.ts tests/moderation/inactivity_test.ts tests/moderation/rules_test.ts tests/web/local_crypto_test.ts tests/web/account_mail_test.ts tests/moderation/attachments_test.ts tests/web/links_test.ts tests/web/install_test.ts tests/web/conv_display_test.ts tests/web/dot_center_test.ts tests/web/suggestion_test.ts tests/web/block_suggest_fixture_test.ts tests/web/limit_text_test.ts tests/web/message_time_test.ts tests/moderation/replies_test.ts tests/moderation/plan_limits_test.ts tests/web/composer_test.ts tests/moderation/clarification_contract_test.ts tests/moderation/clarification_schema_test.ts tests/moderation/topics_test.ts tests/web/blocking_lists_test.ts tests/web/export_render_test.ts tests/moderation/conversation_export_test.ts tests/web/verify_export_test.ts tests/moderation/explanation_test.ts tests/web/block_explanation_test.ts tests/web/conv_list_test.ts tests/web/tone_copy_test.ts tests/web/version_check_test.ts tests/web/composer_slim_test.ts tests/moderation/reply_context_test.ts tests/web/native_ready_test.ts tests/moderation/sticky_block_test.ts tests/moderation/determinism_test.ts tests/moderation/uncertain_test.ts
      - run: cd supabase/functions && deno check */index.ts
      - run: deno test --config supabase/functions/deno.json --allow-env=APP_URL,MAILER_URL,MAILER_SECRET tests/export/signature_test.ts
      - run: deno test --config supabase/functions/deno.json --allow-env=APP_URL,MAILER_URL,MAILER_SECRET,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY,SUPABASE_SECRET_KEYS,SUPABASE_PUBLISHABLE_KEYS tests/email/invite_lang_test.ts tests/email/remaining_mail_lang_test.ts tests/email/report_input_test.ts
      - run: deno test --config supabase/functions/deno.json --allow-env=APP_URL,MAILER_URL,MAILER_SECRET,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY,SUPABASE_SECRET_KEYS,SUPABASE_PUBLISHABLE_KEYS,APP_ENV,TEST_MAIL_ALLOW,DEMO_OPEN_MAIL,MODERATION_PROVIDER,MODERATION_TIER,MODERATION_TIMEOUT_MS,GEMINI_API_KEY,GEMINI_MODEL,MODERATION_MODEL,OPENAI_API_KEY,OPENAI_BASE_URL,OPENAI_MODEL tests/email/address_check_test.ts
      - run: cd apps/web && npm ci && npm run test:back && npm run test:receive && npm run test:clarification && npm run test:blocking && npm run test:court-export && npm run test:native && npm run test:dialogs && npm run build
        env: { VITE_SUPABASE_URL: "https://example.supabase.co", VITE_SUPABASE_PUBLISHABLE_KEY: "ci" }
      - run: npm run test:notifications
