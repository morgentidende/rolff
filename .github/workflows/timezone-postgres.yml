# Draft new workflow; no production secrets. Each matrix job gets a fresh database.
name: timezone-postgres
on: [push, pull_request]
permissions:
  contents: read
jobs:
  timezone-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        script: [timezone-functional.mjs, timezone-concurrency.mjs, blocking-concurrency.mjs, conversation-exports-postgres.mjs]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rolff_timezone_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: rolff_test_timezone
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U rolff_timezone_test -d rolff_test_timezone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: tests/sql
      - run: node tests/sql/${{ matrix.script }}
        env:
          CI: 'true'
          TIMEZONE_SQL_TEST: synthetic-only
          TIMEZONE_SQL_BACKEND: postgres
          TIMEZONE_TEST_DATABASE_URL: postgresql://rolff_timezone_test:synthetic-ci-only@127.0.0.1:5432/rolff_test_timezone
